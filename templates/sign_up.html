{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4">Create Account</h1>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="fullName" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary">Create New Account</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Log In</a>
        </form>
    </div>
</div>
{% endblock %}
