<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sell Stocks</title>
</head>
<body>
    <h1>Sell Stocks</h1>
    {% for message in get_flashed_messages() %}
        <p style="text-align: center;">
            <strong>{{ message }}</strong>
        </p>
    {% endfor %}

    <form method="POST" action="{{ url_for('sell') }}">
        <label for="stockID">Select a stock:</label>
        <select id="stockID" name="stockID" required>
            {% for stock in stocks %}
            <option value="{{ stock.stockID }}">
                {{ stock.ticker }} — ${{ stock.currentMarketPrice }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="quantity">Number of shares:</label>
        <input type="number" id="quantity" name="quantity"
               min="0.01" step="0.01" required>

        <br><br>

        <button type="submit">Sell</button>
    </form>

    <p><a href="{{ url_for('index') }}">Back to Home</a></p>
</body>
</html>
