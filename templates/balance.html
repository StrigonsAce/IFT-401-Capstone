{% extends "base.html" %}
{% block title %}Balance{% endblock %}
{% block content %}
<h1>Balance</h1>
<p>Available funds: ${{ "%.2f"|format(customer.availableFunds) }}</p>
<form method="POST" action="{{ url_for('balance') }}">
    <div class="mb-3">
        <label for="updateType" class="form-label">Deposit or Withdraw</label>
        <select id="updateType" name="updateType" class="form-select" required>
            <option value="Deposit">Deposit</option>
            <option value="Withdraw">Withdraw</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="updateFunds" class="form-label">Amount</label>
        <input type="number" id="updateFunds" name="updateFunds" class="form-control" min="0.01" step="0.01" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
</form>
{% endblock %}
