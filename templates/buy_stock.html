{% extends "base.html" %}
{% block title %}Buy Stocks{% endblock %}
{% block content %}
<h1>Buy Stocks</h1>
<form method="POST" action="{{ url_for('buy') }}">
    <div class="mb-3">
        <label for="stockID" class="form-label">Select a stock:</label>
        <select id="stockID" name="stockID" class="form-select" required>
            {% for stock in stocks %}
            <option value="{{ stock.stockID }}">
                {{ stock.ticker }} — ${{ stock.currentMarketPrice }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="quantity" class="form-label">Number of shares:</label>
        <input type="number" id="quantity" name="quantity" class="form-control" min="0.01" step="0.01" required>
    </div>
    <button type="submit" class="btn btn-primary">Buy</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
</form>
{% endblock %}
